<section class="h-full rounded-3xl border border-gray-200 bg-white p-6 shadow-[0_18px_40px_-30px_rgba(15,23,42,0.35)] dark:border-gray-800 dark:bg-white/[0.03]">
  <div class="flex items-center gap-2 mb-1">
    <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-slate-500/10 to-gray-500/10">
      <svg class="h-4 w-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
    </div>
    <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Recursos legales</p>
  </div>
  <h3 class="text-xl font-semibold text-gray-900 dark:text-white">Legal y privacidad</h3>

  <div class="mt-5 grid grid-cols-1 gap-2">
    @for (resource of resources; track resource.id) {
      <button
        type="button"
        class="group flex items-center justify-between gap-3 rounded-xl border border-gray-100 bg-gray-50/50 px-4 py-3 text-sm font-medium text-gray-700 transition-all hover:border-gray-200 hover:bg-white dark:border-gray-800 dark:bg-white/[0.02] dark:text-gray-200 dark:hover:border-gray-700 dark:hover:bg-white/[0.04]"
        (click)="openResourceModal(resource)"
      >
        <div class="flex items-center gap-3">
          <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-gray-100 dark:bg-gray-800">
            <svg class="h-4 w-4 text-gray-500 dark:text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
          </div>
          <span>{{ resource.title }}</span>
        </div>
        <svg class="h-4 w-4 text-gray-300 transition-all group-hover:translate-x-1 group-hover:text-gray-500 dark:text-gray-600 dark:group-hover:text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
        </svg>
      </button>
    }
  </div>

  <!-- Contact info -->
  <div class="mt-5 rounded-xl border border-dashed border-gray-200 bg-gray-50/50 p-4 dark:border-gray-700 dark:bg-white/[0.02]">
    <p class="text-xs font-medium text-gray-600 dark:text-gray-300">¿Tienes dudas sobre nuestras políticas?</p>
    <a href="mailto:legal@weeklylanding.com" class="mt-1 inline-flex items-center gap-1.5 text-xs text-brand-500 hover:text-brand-600 dark:text-brand-400 dark:hover:text-brand-300">
      <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
      legal&#64;weeklylanding.com
    </a>
  </div>
</section>

@if (selectedResource) {
  <div
    class="fixed inset-0 z-[9999] flex items-center justify-center bg-gray-900/60 p-4"
    (click)="closeResourceModal()"
  >
    <div
      class="w-full max-w-lg rounded-2xl border border-gray-200 bg-white p-6 dark:border-gray-800 dark:bg-gray-900"
      (click)="$event.stopPropagation()"
    >
      <div class="mb-4 flex items-center justify-between">
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
          {{ selectedResource.title }}
        </h3>
        <button
          type="button"
          class="rounded-lg px-2 py-1 text-sm text-gray-500 hover:bg-gray-100 dark:hover:bg-white/10"
          (click)="closeResourceModal()"
        >
          Cerrar
        </button>
      </div>

      <p class="text-sm leading-6 text-gray-700 dark:text-gray-300">
        {{ sampleText }}
      </p>

      <div class="mt-5 flex justify-end">
        <button
          type="button"
          class="rounded-xl bg-brand-500 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-600"
          (click)="closeResourceModal()"
        >
          Entendido
        </button>
      </div>
    </div>
  </div>
}
