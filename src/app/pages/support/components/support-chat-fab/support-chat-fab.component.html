<!-- FAB Button -->
<div class="fixed bottom-6 right-6 z-50">
  <button
    class="group relative flex h-14 w-14 items-center justify-center rounded-full bg-gradient-to-r from-brand-500 to-brand-600 text-white shadow-lg shadow-brand-500/30 transition-all hover:scale-105 hover:shadow-xl hover:shadow-brand-500/40 focus:outline-none focus:ring-4 focus:ring-brand-500/30"
    type="button"
    (click)="openChat()"
    aria-label="Abrir chat de soporte"
  >
    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
    </svg>

    <!-- Pulse effect -->
    <span class="absolute -right-1 -top-1 flex h-4 w-4">
      <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
      <span class="relative inline-flex h-4 w-4 rounded-full bg-emerald-500 ring-2 ring-white dark:ring-gray-900"></span>
    </span>

    <!-- Tooltip -->
    <span class="pointer-events-none absolute bottom-full right-0 mb-2 whitespace-nowrap rounded-lg bg-gray-900 px-3 py-1.5 text-xs font-medium text-white opacity-0 shadow-lg transition-opacity group-hover:opacity-100 dark:bg-gray-700">
      ¿Necesitas ayuda?
      <span class="absolute -bottom-1 right-4 h-2 w-2 rotate-45 bg-gray-900 dark:bg-gray-700"></span>
    </span>
  </button>
</div>

<!-- Backdrop -->
@if (open$ | async) {
  <div
    class="fixed inset-0 z-99999 bg-black/30 backdrop-blur-sm transition-opacity"
    (click)="closeChat()"
    aria-hidden="true"
  ></div>
}

<!-- Chat Panel -->
<app-support-chat-panel
  [open]="(open$ | async) ?? false"
  (close)="closeChat()"
/>
