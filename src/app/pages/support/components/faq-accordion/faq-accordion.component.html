<section class="rounded-3xl border border-gray-200 bg-white p-6 shadow-[0_18px_40px_-30px_rgba(15,23,42,0.35)] dark:border-gray-800 dark:bg-white/[0.03]">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <p class="text-sm font-medium text-gray-500 dark:text-gray-400">FAQs</p>
      <h3 class="mt-1 text-2xl font-semibold text-gray-900 dark:text-white">Preguntas frecuentes</h3>
    </div>
    <div class="w-full max-w-sm">
      <label class="sr-only" for="faq-search">Buscar en FAQ</label>
      <input
        id="faq-search"
        type="text"
        [value]="query"
        (input)="onInput($any($event.target).value)"
        placeholder="Filtra por palabra clave"
        class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-2 text-sm text-gray-800 outline-none transition focus:border-brand-300 focus:bg-white focus:ring-2 focus:ring-brand-200 dark:border-gray-800 dark:bg-gray-900 dark:text-white dark:focus:border-brand-500 dark:focus:ring-brand-500/30"
        aria-label="Buscar preguntas frecuentes"
      />
    </div>
  </div>

  <div class="mt-6 space-y-3">
    @for (faq of faqs; track faq.id) {
      <div class="rounded-2xl border border-gray-100 bg-gray-50 p-4 transition dark:border-gray-800 dark:bg-white/[0.04]">
        <button
          class="flex w-full items-center justify-between text-left"
          (click)="onToggle(faq.id)"
          [attr.aria-expanded]="openId === faq.id"
        >
          <span class="text-sm font-semibold text-gray-900 dark:text-white/90">{{ faq.question }}</span>
          <span class="text-gray-400">{{ openId === faq.id ? '−' : '+' }}</span>
        </button>
        @if (openId === faq.id) {
          <p class="mt-3 text-sm text-gray-600 dark:text-gray-300">{{ faq.answer }}</p>
          <div class="mt-3 flex flex-wrap gap-2">
            @for (tag of faq.tags; track tag) {
              <span class="rounded-full bg-white px-3 py-1 text-xs font-medium text-gray-600 dark:bg-white/[0.06] dark:text-gray-300">
                {{ tag }}
              </span>
            }
          </div>
        }
      </div>
    }
  </div>
</section>
