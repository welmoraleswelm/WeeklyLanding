<section class="rounded-3xl border border-gray-200 bg-white px-6 py-8 shadow-[0_20px_50px_-40px_rgba(15,23,42,0.45)] dark:border-gray-800 dark:bg-white/[0.03] sm:px-10">
  <div class="flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">
    <div>
      <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Help Center</p>
      <h1 class="mt-2 text-3xl font-semibold text-gray-900 dark:text-white sm:text-4xl">
        ¿En qué podemos ayudarte hoy?
      </h1>
      <p class="mt-2 max-w-2xl text-sm text-gray-500 dark:text-gray-400">
        Busca guías, preguntas frecuentes y recursos para resolver incidencias en tickets y facturación.
      </p>
    </div>

    <div class="w-full max-w-lg">
      <label class="sr-only" for="support-search">Buscar</label>
      <div class="relative">
        <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm10 2-4.3-4.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </span>
        <input
          id="support-search"
          type="text"
          [value]="query"
          (input)="onInput($any($event.target).value)"
          placeholder="Buscar ayuda, por ejemplo: reintentos, CFDI, RFC..."
          class="w-full rounded-2xl border border-gray-200 bg-gray-50 py-3 pl-11 pr-4 text-sm text-gray-800 shadow-sm outline-none ring-0 transition focus:border-brand-300 focus:bg-white focus:ring-2 focus:ring-brand-200 dark:border-gray-800 dark:bg-gray-900 dark:text-white dark:focus:border-brand-500 dark:focus:bg-gray-900 dark:focus:ring-brand-500/30"
          aria-label="Buscar en ayuda"
        />
      </div>
      <p class="mt-2 text-xs text-gray-500 dark:text-gray-400">{{ resultsCount }} resultados encontrados</p>
    </div>
  </div>
</section>
