<section class="rounded-3xl border border-gray-200 bg-white p-6 shadow-[0_18px_40px_-30px_rgba(15,23,42,0.35)] dark:border-gray-800 dark:bg-white/[0.03]">
  <div class="flex items-start justify-between">
    <div>
      <p class="text-sm font-medium text-gray-500 dark:text-gray-400">AI Support</p>
      <h3 class="mt-1 text-2xl font-semibold text-gray-900 dark:text-white">Asistente inteligente</h3>
    </div>
    <span class="rounded-full bg-brand-50 px-3 py-1 text-xs font-semibold text-brand-600 dark:bg-brand-500/15 dark:text-brand-400">Beta</span>
  </div>

  <div class="mt-5 max-h-64 space-y-3 overflow-y-auto">
    @for (message of messages; track message.id) {
      <div class="flex" [ngClass]="{ 'justify-end': message.author === 'user' }">
        <div
          class="max-w-[80%] rounded-2xl px-4 py-2 text-sm"
          [ngClass]="message.author === 'user'
            ? 'bg-brand-500 text-white'
            : 'bg-gray-100 text-gray-700 dark:bg-white/[0.06] dark:text-gray-200'"
        >
          {{ message.text }}
        </div>
      </div>
    }
  </div>

  <div class="mt-4 rounded-2xl border border-gray-100 bg-gray-50 p-4 dark:border-gray-800 dark:bg-white/[0.04]">
    <p class="text-xs font-medium text-gray-500 dark:text-gray-400">Sugerencias rápidas</p>
    <div class="mt-2 flex flex-wrap gap-2">
      @for (suggestion of suggestions; track suggestion.id) {
        <span class="rounded-full bg-white px-3 py-1 text-xs font-semibold text-gray-700 dark:bg-white/[0.06] dark:text-gray-200">
          {{ suggestion.title }}
        </span>
      }
    </div>
  </div>

  <div class="mt-4 flex items-center gap-2">
    <label class="sr-only" for="ai-input">Escribe tu consulta</label>
    <input
      id="ai-input"
      type="text"
      [value]="inputValue"
      (input)="onInput($any($event.target).value)"
      (keydown.enter)="send()"
      placeholder="Escribe tu problema..."
      class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-2 text-sm text-gray-900 outline-none transition focus:border-brand-300 focus:bg-white focus:ring-2 focus:ring-brand-200 dark:border-gray-800 dark:bg-gray-900 dark:text-white dark:focus:border-brand-500 dark:focus:ring-brand-500/30"
    />
    <button
      class="rounded-2xl bg-brand-500 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-600"
      (click)="send()"
      aria-label="Enviar mensaje"
    >
      Enviar
    </button>
  </div>
</section>
