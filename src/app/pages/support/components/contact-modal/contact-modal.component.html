@if (open) {
  <div class="fixed inset-0 z-99999 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm" (click)="onClose()" aria-hidden="true"></div>

    <div class="relative z-10 w-full max-w-3xl">
      <div class="flex items-center justify-between rounded-t-3xl border border-gray-200 bg-white px-6 py-4 shadow-[0_18px_40px_-30px_rgba(15,23,42,0.35)] dark:border-gray-800 dark:bg-gray-900">
        <div>
          <p class="text-xs font-semibold uppercase text-gray-400">Soporte</p>
          <h3 class="text-xl font-semibold text-gray-900 dark:text-white">Abrir solicitud</h3>
        </div>
        <button class="rounded-full bg-gray-100 px-3 py-1 text-xs font-semibold text-gray-700 hover:bg-gray-200 dark:bg-white/[0.06] dark:text-white/80" (click)="onClose()">
          Cerrar
        </button>
      </div>

      <div class="rounded-b-3xl border border-t-0 border-gray-200 bg-white p-6 shadow-[0_18px_40px_-30px_rgba(15,23,42,0.35)] dark:border-gray-800 dark:bg-gray-900">
        <app-contact-support-form />
      </div>
    </div>
  </div>
}
