<section class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">
  @for (action of actions; track action.id) {
    <article class="rounded-3xl border border-gray-200 bg-white p-5 shadow-[0_18px_40px_-30px_rgba(15,23,42,0.35)] transition hover:-translate-y-1 dark:border-gray-800 dark:bg-white/[0.03]">
      <div class="flex items-start gap-4">
        <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-brand-50 text-brand-600 dark:bg-brand-500/15 dark:text-brand-400">
          @switch (action.icon) {
            @case ('ticket') {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16v4a2 2 0 0 1 0 4v4H4v-4a2 2 0 0 0 0-4V7Z" stroke="currentColor" stroke-width="1.5"/></svg>
            }
            @case ('portal') {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4h16v16H4z" stroke="currentColor" stroke-width="1.5"/><path d="M8 8h8v8H8z" stroke="currentColor" stroke-width="1.5"/></svg>
            }
            @case ('billing') {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 4h12v16l-3-2-3 2-3-2-3 2V4Z" stroke="currentColor" stroke-width="1.5"/></svg>
            }
            @case ('security') {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3 19 6v6c0 4-3 7-7 9-4-2-7-5-7-9V6l7-3Z" stroke="currentColor" stroke-width="1.5"/></svg>
            }
            @case ('api') {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 8h12M6 12h12M6 16h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            }
            @case ('download') {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v10m0 0 4-4m-4 4-4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M4 18h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            }
          }
        </div>
        <div>
          <h3 class="text-lg font-semibold text-gray-900 dark:text-white">{{ action.title }}</h3>
          <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ action.description }}</p>
        </div>
      </div>
      <button class="mt-4 inline-flex items-center text-sm font-semibold text-brand-600 hover:text-brand-700 dark:text-brand-400 dark:hover:text-brand-300" aria-label="Ir a acción">
        Ver más
        <span class="ml-1">→</span>
      </button>
    </article>
  }
</section>
