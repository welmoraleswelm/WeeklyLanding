<section class="rounded-3xl border border-gray-200 bg-white p-6 shadow-[0_18px_40px_-30px_rgba(15,23,42,0.35)] dark:border-gray-800 dark:bg-white/[0.03]">
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div>
      <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Contacto</p>
      <h3 class="mt-1 text-2xl font-semibold text-gray-900 dark:text-white">Habla con soporte</h3>
    </div>
    <span class="rounded-full bg-gray-100 px-3 py-1 text-xs font-semibold text-gray-700 dark:bg-white/[0.06] dark:text-white/80">Tiempo promedio: 1h</span>
  </div>

  <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
      <label class="space-y-2 text-sm text-gray-700 dark:text-gray-300">
        Categoría
        <select
          formControlName="category"
          class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-2 text-sm text-gray-900 outline-none transition focus:border-brand-300 focus:bg-white focus:ring-2 focus:ring-brand-200 dark:border-gray-800 dark:bg-gray-900 dark:text-white dark:focus:border-brand-500 dark:focus:ring-brand-500/30"
        >
          <option value="" disabled>Selecciona una categoría</option>
          @for (cat of categories; track cat) {
            <option [value]="cat">{{ cat }}</option>
          }
        </select>
      </label>

      <label class="space-y-2 text-sm text-gray-700 dark:text-gray-300">
        Prioridad
        <select
          formControlName="priority"
          class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-2 text-sm text-gray-900 outline-none transition focus:border-brand-300 focus:bg-white focus:ring-2 focus:ring-brand-200 dark:border-gray-800 dark:bg-gray-900 dark:text-white dark:focus:border-brand-500 dark:focus:ring-brand-500/30"
        >
          @for (priority of priorities; track priority) {
            <option [value]="priority">{{ priority }}</option>
          }
        </select>
      </label>
    </div>

    <label class="space-y-2 text-sm text-gray-700 dark:text-gray-300">
      Asunto
      <input
        type="text"
        formControlName="subject"
        class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-2 text-sm text-gray-900 outline-none transition focus:border-brand-300 focus:bg-white focus:ring-2 focus:ring-brand-200 dark:border-gray-800 dark:bg-gray-900 dark:text-white dark:focus:border-brand-500 dark:focus:ring-brand-500/30"
        placeholder="Ej. Error al descargar CFDI"
      />
      @if (form.get('subject')?.touched && form.get('subject')?.invalid) {
        <span class="text-xs text-red-500">Ingresa un asunto válido.</span>
      }
    </label>

    <label class="space-y-2 text-sm text-gray-700 dark:text-gray-300">
      Descripción
      <textarea
        rows="4"
        formControlName="description"
        class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-2 text-sm text-gray-900 outline-none transition focus:border-brand-300 focus:bg-white focus:ring-2 focus:ring-brand-200 dark:border-gray-800 dark:bg-gray-900 dark:text-white dark:focus:border-brand-500 dark:focus:ring-brand-500/30"
        placeholder="Describe el problema con detalle..."
      ></textarea>
      @if (form.get('description')?.touched && form.get('description')?.invalid) {
        <span class="text-xs text-red-500">Describe el problema (mín. 10 caracteres).</span>
      }
    </label>

    <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
      <label class="space-y-2 text-sm text-gray-700 dark:text-gray-300">
        ID de ticket (opcional)
        <input
          type="text"
          formControlName="ticketId"
          class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-2 text-sm text-gray-900 outline-none transition focus:border-brand-300 focus:bg-white focus:ring-2 focus:ring-brand-200 dark:border-gray-800 dark:bg-gray-900 dark:text-white dark:focus:border-brand-500 dark:focus:ring-brand-500/30"
          placeholder="TCK-1234"
        />
      </label>

      <label class="space-y-2 text-sm text-gray-700 dark:text-gray-300">
        Adjuntos (opcional)
        <input
          type="text"
          formControlName="attachments"
          class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-2 text-sm text-gray-900 outline-none transition focus:border-brand-300 focus:bg-white focus:ring-2 focus:ring-brand-200 dark:border-gray-800 dark:bg-gray-900 dark:text-white dark:focus:border-brand-500 dark:focus:ring-brand-500/30"
          placeholder="Arrastra o pega URL"
        />
      </label>

      <label class="space-y-2 text-sm text-gray-700 dark:text-gray-300">
        Email (opcional)
        <input
          type="email"
          formControlName="email"
          class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-4 py-2 text-sm text-gray-900 outline-none transition focus:border-brand-300 focus:bg-white focus:ring-2 focus:ring-brand-200 dark:border-gray-800 dark:bg-gray-900 dark:text-white dark:focus:border-brand-500 dark:focus:ring-brand-500/30"
          placeholder="correo@empresa.com"
        />
      </label>
    </div>

    <label class="flex items-start gap-2 text-sm text-gray-600 dark:text-gray-300">
      <input
        type="checkbox"
        formControlName="acceptPolicies"
        class="mt-1 h-4 w-4 rounded border-gray-300 text-brand-500 focus:ring-brand-200 dark:border-gray-700 dark:bg-gray-900"
      />
      <span>Acepto políticas de privacidad y términos de servicio.</span>
    </label>

    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <p class="text-xs text-gray-500 dark:text-gray-400">Campos obligatorios marcados automáticamente.</p>
      <button
        type="submit"
        class="rounded-2xl bg-brand-500 px-6 py-3 text-sm font-semibold text-white transition hover:bg-brand-600 disabled:cursor-not-allowed disabled:bg-gray-200 disabled:text-gray-500 dark:disabled:bg-white/[0.06] dark:disabled:text-white/40"
        [disabled]="form.invalid || isSubmitting"
      >
        @if (isSubmitting) {
          Enviando...
        } @else {
          Enviar solicitud
        }
      </button>
    </div>

    @if (showSuccess) {
      <div class="rounded-2xl border border-emerald-100 bg-emerald-50 p-4 text-sm text-emerald-700 dark:border-emerald-900/40 dark:bg-emerald-500/10 dark:text-emerald-300">
        ¡Tu solicitud fue enviada! Te contactaremos pronto.
      </div>
    }
  </form>
</section>
