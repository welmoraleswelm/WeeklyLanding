<div class="h-full rounded-3xl border border-gray-200 bg-white p-6 shadow-[0_18px_40px_-30px_rgba(15,23,42,0.45)] dark:border-gray-800 dark:bg-white/[0.03]">
  <div class="flex items-start justify-between">
    <div>
      <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Estado de suscripción</p>
      <h3 class="mt-1 text-xl font-semibold text-gray-900 dark:text-white">{{ summary.statusLabel }}</h3>
    </div>
    <span [class]="statusBadgeClasses">{{ summary.statusLabel }}</span>
  </div>

  <div class="mt-6 space-y-4">
    <div class="rounded-2xl border border-gray-100 bg-gray-50 p-4 dark:border-gray-800 dark:bg-white/[0.04]">
      <p class="text-xs font-medium text-gray-500 dark:text-gray-400">Próxima renovación</p>
      <p class="mt-1 text-lg font-semibold text-gray-900 dark:text-white">{{ summary.nextRenewalDate }}</p>
      <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">{{ summary.renewalLabel }}</p>
    </div>

    <div class="rounded-2xl border border-gray-100 p-4 dark:border-gray-800 dark:bg-white/[0.02]">
      <p class="text-xs font-medium text-gray-500 dark:text-gray-400">Costo</p>
      <p class="mt-1 text-lg font-semibold text-gray-900 dark:text-white">{{ summary.costoLabel }}</p>
    </div>
  </div>
</div>
