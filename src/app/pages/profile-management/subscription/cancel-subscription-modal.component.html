@if (open) {
  <div class="fixed inset-0 z-99999 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm" (click)="onClose()"></div>

    <div class="relative z-10 w-full max-w-lg rounded-3xl border border-gray-200 bg-white p-6 shadow-2xl dark:border-gray-800 dark:bg-gray-900">
      <div class="flex items-start justify-between gap-3">
        <div>
          <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Cancelar suscripción</p>
          <h3 class="mt-1 text-2xl font-semibold text-gray-900 dark:text-white">¿Estás seguro?</h3>
        </div>
        <button class="rounded-full bg-gray-100 px-3 py-1 text-xs font-semibold text-gray-600 hover:bg-gray-200 dark:bg-white/[0.06] dark:text-white/80" (click)="onClose()">
          Cerrar
        </button>
      </div>

      <div class="mt-5 rounded-lg border border-red-100 bg-red-50 p-4 text-sm text-red-700 dark:border-red-900/40 dark:bg-red-500/10 dark:text-red-300">
        Tu plan <span class="font-semibold">{{ planName }}</span> permanecerá activo hasta
        <span class="font-semibold">{{ endDateLabel }}</span>. Después, perderás acceso a los beneficios del plan.
      </div>

      <div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
        <button
          class="rounded-lg border border-gray-200 px-5 py-2.5 text-sm font-semibold text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-200 dark:hover:bg-white/[0.06]"
          (click)="onClose()"
        >
          Mantener suscripción
        </button>
        <button
          class="rounded-lg bg-red-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-red-500"
          (click)="onConfirm()"
        >
          Sí, cancelar
        </button>
      </div>
    </div>
  </div>
}
