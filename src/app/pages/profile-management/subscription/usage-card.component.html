<div class="h-full rounded-3xl border border-gray-200 bg-white p-6 shadow-[0_18px_40px_-30px_rgba(15,23,42,0.45)] dark:border-gray-800 dark:bg-white/[0.03]">
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div>
      <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Uso del plan</p>
      <h3 class="mt-1 text-2xl font-semibold text-gray-900 dark:text-white">Consumo actual</h3>
    </div>
    <div class="text-right">
      <span class="rounded-full bg-gray-100 px-3 py-1 text-xs font-semibold text-gray-700 dark:bg-white/[0.06] dark:text-white/80">
        {{ summaryTopLabel }}
      </span>
      @if (summaryBottomLabel) {
        <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">{{ summaryBottomLabel }}</p>
      }
    </div>
  </div>

  <div class="mt-6 space-y-5">
    @for (metric of metrics; track metric.key) {
      <div class="rounded-2xl border border-gray-100 bg-gray-50 p-4 dark:border-gray-800 dark:bg-white/[0.04]">
        <div class="flex flex-wrap items-start justify-between gap-2">
          <div>
            <p class="text-sm font-semibold text-gray-900 dark:text-white/90">{{ metric.label }}</p>
            <p class="text-xs text-gray-500 dark:text-gray-400">{{ metric.helper }}</p>
          </div>
          <div class="text-right">
            <p class="text-lg font-semibold text-gray-900 dark:text-white">{{ metric.used }} / {{ getDisplayLimit(metric) }}</p>
          </div>
        </div>

        <div class="mt-3 h-2 w-full rounded-full bg-gray-200 dark:bg-gray-800">
          <div
            [class]="getProgressClasses(metric)"
            [style.width.%]="getPercent(metric)"
          ></div>
        </div>
      </div>
    }
  </div>
</div>
