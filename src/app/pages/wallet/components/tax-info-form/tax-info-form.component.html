<section class="rounded-3xl border border-gray-200 bg-white p-6 shadow-[0_18px_40px_-30px_rgba(15,23,42,0.35)] dark:border-gray-800 dark:bg-white/[0.03]">
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div>
      <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Datos fiscales</p>
      <h3 class="mt-1 text-2xl font-semibold text-gray-900 dark:text-white">Facturación de suscripción</h3>
      <p class="mt-2 text-sm text-gray-600 dark:text-gray-300">
        Estos datos son para la factura de tu suscripción, no para la facturación de tickets.
      </p>
    </div>
  </div>

  <form class="mt-6 grid gap-4" [formGroup]="form" (ngSubmit)="submit()">
    <div class="grid gap-4 md:grid-cols-2">
      <label class="text-sm font-semibold text-gray-700 dark:text-gray-200">
        RFC
        <input
          type="text"
          formControlName="rfc"
          class="mt-2 w-full rounded-2xl border border-gray-200 bg-white px-4 py-2 text-sm text-gray-900 shadow-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-200 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100 dark:focus:ring-brand-500/20"
          placeholder="XAXX010101000"
          aria-label="RFC"
        />
      </label>
      <label class="text-sm font-semibold text-gray-700 dark:text-gray-200">
        Razón social
        <input
          type="text"
          formControlName="razonSocial"
          class="mt-2 w-full rounded-2xl border border-gray-200 bg-white px-4 py-2 text-sm text-gray-900 shadow-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-200 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100 dark:focus:ring-brand-500/20"
          placeholder="Mi empresa S.A. de C.V."
          aria-label="Razón social"
        />
      </label>
    </div>

    <div class="grid gap-4 md:grid-cols-2">
      <label class="text-sm font-semibold text-gray-700 dark:text-gray-200">
        Uso CFDI
        <select
          formControlName="usoCfdi"
          class="mt-2 w-full rounded-2xl border border-gray-200 bg-white px-4 py-2 text-sm text-gray-900 shadow-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-200 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100 dark:focus:ring-brand-500/20"
          aria-label="Uso CFDI"
        >
          <option value="" disabled>Selecciona uso CFDI</option>
          @for (option of usoCfdiOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </label>
      <label class="text-sm font-semibold text-gray-700 dark:text-gray-200">
        Correo de facturación
        <input
          type="email"
          formControlName="emailFacturacion"
          class="mt-2 w-full rounded-2xl border border-gray-200 bg-white px-4 py-2 text-sm text-gray-900 shadow-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-200 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100 dark:focus:ring-brand-500/20"
          placeholder="facturacion@empresa.com"
          aria-label="Correo de facturación"
        />
      </label>
    </div>

    <label class="text-sm font-semibold text-gray-700 dark:text-gray-200">
      Domicilio fiscal (opcional)
      <input
        type="text"
        formControlName="domicilioFiscal"
        class="mt-2 w-full rounded-2xl border border-gray-200 bg-white px-4 py-2 text-sm text-gray-900 shadow-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-200 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100 dark:focus:ring-brand-500/20"
        placeholder="Calle, número, ciudad"
        aria-label="Domicilio fiscal"
      />
    </label>

    <div class="flex flex-wrap items-center gap-3">
      <button
        type="submit"
        class="rounded-2xl bg-brand-500 px-5 py-2 text-sm font-semibold text-white hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-60"
        [disabled]="isSaving"
      >
        @if (isSaving) {
          Guardando...
        } @else {
          Guardar datos fiscales
        }
      </button>
      @if (successMessage) {
        <span class="rounded-full bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-300">
          {{ successMessage }}
        </span>
      }
    </div>
  </form>
</section>
