<section
  class="h-full relative overflow-hidden rounded-3xl border border-gray-200 bg-white shadow-[0_18px_40px_-30px_rgba(15,23,42,0.35)] dark:border-gray-800 dark:bg-white/[0.03]">
  <!-- Background decorations -->
  <div
    class="absolute -left-20 -top-20 h-64 w-64 rounded-full bg-gradient-to-br from-brand-500/10 to-brand-600/5 blur-3xl">
  </div>
  <div
    class="absolute -bottom-20 -right-20 h-64 w-64 rounded-full bg-gradient-to-br from-blue-500/10 to-cyan-500/5 blur-3xl">
  </div>

  <div class="relative p-6 sm:p-8">
    <div class="grid grid-cols-1 gap-6 lg:grid-cols-[minmax(0,1fr)_320px] lg:items-center">
      <!-- Content -->
      <div class="flex items-start gap-4">
        <!-- Wallet icon -->
        <div
          class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-gradient-to-br from-brand-500 to-brand-600 shadow-lg shadow-brand-500/25">
          <svg class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M21 12a2.25 2.25 0 0 0-2.25-2.25H15a3 3 0 1 1-6 0H5.25A2.25 2.25 0 0 0 3 12m18 0v6a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 18v-6m18 0V9M3 12V9m18 0a2.25 2.25 0 0 0-2.25-2.25H5.25A2.25 2.25 0 0 0 3 9m18 0V6a2.25 2.25 0 0 0-2.25-2.25H5.25A2.25 2.25 0 0 0 3 6v3" />
          </svg>
        </div>
        <div>
          <h1 class="text-xl md:text-2xl lg:text-3xl font-semibold text-gray-800 dark:text-white/90">Cartera</h1>
          <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Administra tu plan, métodos de pago y recibos de
            facturación.</p>
        </div>
      </div>

      <!-- Plan card -->
      <div class="rounded-2xl border border-gray-100 bg-gray-100 p-4 dark:border-gray-800 dark:bg-white/[0.04]">
        <div
          class="absolute inset-0 bg-gradient-to-br from-brand-500/[0.03] to-transparent opacity-0 transition-opacity group-hover:opacity-100 dark:from-brand-500/10">
        </div>
        <div class="relative">
          <div class="flex items-center gap-2">
            <span class="flex h-2 w-2 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500/50"></span>
            <p class="text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Plan actual</p>
          </div>
          <p class="mt-2 text-lg font-bold text-gray-900 dark:text-white">{{ plan.name }}</p>
          <p class="mt-0.5 text-sm font-semibold text-brand-600 dark:text-brand-400">{{ plan.priceLabel }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
