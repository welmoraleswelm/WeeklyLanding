<app-page-breadcrumb pageTitle="Métodos de pago" />

<div class="min-h-screen bg-gray-50 pb-16 dark:bg-gray-950/40">
  <div class="mx-auto max-w-2xl space-y-6 px-4 pb-12 pt-8 sm:px-6 lg:px-8">
    @if (message$ | async; as message) {
      <div
        class="flex flex-wrap items-center justify-between gap-3 rounded-3xl border border-brand-200 bg-brand-50 px-6 py-4 text-sm font-semibold text-brand-700 dark:border-brand-500/30 dark:bg-brand-500/10 dark:text-brand-200">
        <span>{{ message }}</span>
        <button
          class="rounded-full border border-brand-200 px-3 py-1 text-xs font-semibold text-brand-700 hover:bg-brand-100 dark:border-brand-500/30 dark:text-brand-200 dark:hover:bg-brand-500/20"
          (click)="clearMessage()">
          Cerrar
        </button>
      </div>
    }

    @if (cards$ | async; as cards) {
      <app-payment-methods
        [cards]="cards"
        (add)="openAddCard()"
        (makeDefault)="makeDefault($event)"
        (remove)="removeCard($event)">
      </app-payment-methods>
    }
  </div>
</div>

<app-add-card-modal
  [open]="isAddCardOpen"
  (close)="closeAddCard()"
  (save)="handleAddCard($event)">
</app-add-card-modal>
