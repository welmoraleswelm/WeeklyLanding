<div class="h-full rounded-3xl border border-gray-200 bg-white p-6 shadow-[0_18px_40px_-30px_rgba(15,23,42,0.45)] dark:border-gray-800 dark:bg-white/[0.03]">
  <!-- Header -->
  <div class="flex items-start justify-between">
    <div>
      <h3 class="text-xl font-semibold text-gray-800 sm:text-2xl lg:text-3xl dark:text-white/90">Tickets</h3>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ dateRangeLabel }}</p>
    </div>
  </div>

  <!-- Total -->
  <div class="mt-5">
    <p class="text-3xl font-semibold text-gray-900 dark:text-white">
      {{ totalFacturadoFormatted }}
      <span class="text-base font-medium text-gray-400 dark:text-white/60">(Total facturado)</span>
    </p>
  </div>

  <!-- Content: left (status cards) + right (visual) -->
  <div class="mt-5 grid grid-cols-1 gap-4 md:grid-cols-2 md:items-stretch">
    <!-- LEFT: status list (misma altura que right) -->

    <!-- Guardados -->
    <div class="relative flex flex-col justify-between rounded-2xl bg-emerald-50 p-4 dark:bg-emerald-500/10">
      <div>
        <p class="text-sm font-medium text-gray-600 dark:text-gray-300">Guardados</p>
        <p class="mt-1 text-3xl font-semibold text-gray-900 dark:text-white">{{ guardados }}</p>
      </div>

      <span class="absolute bottom-3 right-3 inline-flex items-center rounded-full px-3 py-1 text-xs font-semibold">
        <img src="/images/ticket-status/save.svg" alt="" width="20" height="20">
      </span>
    </div>

    <!-- Pendientes -->
    <div class="relative flex flex-col justify-between rounded-2xl bg-yellow-50 p-4 dark:bg-yellow-500/10">
      <div>
        <p class="text-sm font-medium text-gray-600 dark:text-gray-300">Pendientes</p>
        <p class="mt-1 text-3xl font-semibold text-gray-900 dark:text-white">{{ pendientes }}</p>
      </div>

      <span class="absolute bottom-3 right-3 inline-flex items-center rounded-full px-3 py-1 text-xs font-semibold">
        <img src="/images/ticket-status/pending.svg" alt="" width="20" height="20">
      </span>
    </div>

    <!-- Cancelados -->
    <div class="relative flex flex-col justify-between rounded-2xl bg-red-50 p-4 dark:bg-red-500/10">
      <div>
        <p class="text-sm font-medium text-gray-600 dark:text-gray-300">Cancelados</p>
        <p class="mt-1 text-3xl font-semibold text-gray-900 dark:text-white">{{ cancelados }}</p>
      </div>

      <span class="absolute bottom-3 right-3 inline-flex items-center rounded-full px-3 py-1 text-xs font-semibold">
        <img src="/images/ticket-status/cancel.svg" alt="" width="20" height="20">
      </span>
    </div>

    <!-- Facturados -->
    <div class="relative flex flex-col justify-between rounded-2xl bg-blue-50 p-4 dark:bg-blue-500/10">
      <div>
        <p class="text-sm font-medium text-gray-600 dark:text-gray-300">Facturados</p>
        <p class="mt-1 text-3xl font-semibold text-gray-900 dark:text-white">{{ facturados }}</p>
      </div>

      <span class="absolute bottom-3 right-3 inline-flex items-center rounded-full px-3 py-1 text-xs font-semibold">
        <img src="/images/ticket-status/allowed.svg" alt="" width="20" height="20">
      </span>
    </div>
