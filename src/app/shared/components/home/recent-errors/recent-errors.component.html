<div class="h-[430px] rounded-3xl border border-gray-200 bg-white p-6 shadow-[0_18px_40px_-30px_rgba(15,23,42,0.45)] dark:border-gray-800 dark:bg-white/[0.03] flex flex-col">
  <div class="flex items-start justify-between">
    <div>
      <h3 class="text-xl md:text-2xl lg:text-3xl font-semibold text-gray-800 dark:text-white/90">Errores recientes</h3>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">OCR y procesamiento</p>
    </div>
    <span class="rounded-full bg-warning-50 px-3 py-1 text-xs font-semibold text-warning-600 text-[10px] dark:bg-warning-500/15 dark:text-warning-400">{{ alertCountLabel }}</span>
  </div>

  <div class="mt-6 min-h-0 flex-1 overflow-y-auto pr-1">
    <div class="space-y-4">
      @for (error of errors; track error.timestamp + '-' + $index) {
      <div class="flex items-start justify-between gap-3 rounded-2xl border border-gray-100 p-4 dark:border-gray-800 dark:bg-white/[0.02]">
        <div class="flex items-start gap-3">
          <span class="flex h-9 w-9 items-center justify-center rounded-full bg-warning-50 text-warning-600 dark:bg-warning-500/15 dark:text-warning-400">!</span>
          <div>
            <p class="text-sm font-semibold text-gray-800 dark:text-white/90">{{ error.title }}</p>
            <p class="text-xs text-gray-500 dark:text-gray-400">{{ error.detail }}</p>
          </div>
        </div>
        <span class="text-xs text-gray-400 dark:text-gray-500">{{ error.ago }}</span>
      </div>
      } @empty {
      <div class="rounded-2xl border border-gray-100 p-4 text-sm text-gray-500 dark:border-gray-800 dark:text-gray-400">
        Sin errores recientes.
      </div>
      }
    </div>
  </div>
</div>
